[colors]
#background = #00FDFDFD <- transparant
background-ena = #00ffca8d
foreground-ena-alt = #ffca8d
foreground-ena = #724439
background = #FDFDFD
background-alt = #FDFDFD
foreground = #0a62ff
primary = #4b72ff
secondary = #000000
alert = #000000
disabled = #000000
font = #4b72ff

[bar/ena]
width = 100%
spacing = 4
padding = 2
dpi-x = 96
dpi-y = 96
background = ${colors.background-ena}
foreground = ${colors.foreground-ena}
bottom = true
line-size = 2

#round pills setup
height = 29pt
border-bottom-size = 3pt
border-color = ${colors.background-ena}
;module-margin = 1

font-3 = GD\\-MadoMaruGothicJA\\-OTF:size=13;2
;font-0 = GD:style=MadoMaruGoJA-Rebuilt:size=11;2
font-0 = SpaceMono Nerd Font:style=Bold:weight=Bold:size=11;2
;font-0 = FiraCode Nerd Font Mono:style=Bold:weight=regular:size=11;2
;font-0 = CaskaydiaMono Nerd Font:style=Bold:weight=regular:size=11;2
;font-0 = Sarasa Mono CL:weight=Bold:size=11;2
;font-0 = Cantarell:weight=Bold:size=11;2
;font-0 = Comfortaa:style=Bold:weight=Bold:size=11;2
;font-0 = SUSE Mono:style=ExtraBold:weight=Bold:size=11;2
;font-0 = MADE Outer Sans:style=Bold:weight=bold:size=11;2
font-1 = SpaceMono Nerd Font:style=Bold:weight=Bold:size=13;2
font-2 = Symbols Nerd Font:style=Bold:weight=regular:size=30;6
font-4 = Segoe UI Symbol:style=Regular:size=15;2
font-5 = Segoe UI Symbol:style=Regular:size=11;2
font-6 = Segoe UI Symbol:style=Regular:size=12;2

modules-left = launcher
modules-center = xworkspaces3
modules-right = round-left pulseaudio3 brightness3 battery3  wlan3 separator3 date3 round-right

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/separator3]
type = custom/text
format = " | "
format-foreground = ${colors.foreground-ena-alt}
format-background = ${colors.foreground-ena}

[module/launcher]
format = "Applications"
format-right-margin = 2
format-underline = ${colors.foreground-ena}
format-foreground = ${colors.foreground-ena}
click-left = rofi -show drun
click-right = cat ToDo.txt &

[module/xworkspaces3]
type = internal/xworkspaces

;label-active = 
label-active = 
label-active-upper = true
label-active-padding = 1
label-active-foreground = ${colors.foreground-ena}
label-active-background = ${colors.background-ena}
label-active-font = 6

;label-occupied = 🎼
label-occupied = 
label-occupied-padding = 1
label-occupied-foreground = ${colors.foreground-ena}
label-occupied-background = ${colors.background-ena}
label-occupied-font = 7

label-urgent = 
;label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-urgent-foreground = ${colors.foreground-ena}
label-urgent-background = ${colors.background-ena}

;label-empty = ❅
label-empty = 
;label-empty-foreground = ${colors.disabled}
label-empty-padding = 1
label-empty-foreground = ${colors.foreground-ena}
label-empty-background = ${colors.background-ena}

[module/date3]
type = internal/date
date = %H:%M
date-alt = %a, %b %d %Y
format-prefix-foreground = ${colors.primary}
label = "%date% "
;label-foreground = ${colors.primary}
label-foreground = ${colors.foreground-ena-alt}
label-background = ${colors.foreground-ena}

[module/pulseaudio3]
type = internal/pulseaudio

format-volume-prefix = "   "
format-muted-prefix = "   "
;format-volume-prefix-margin-right = 2
format-volume-prefix-foreground = ${colors.foreground-ena-alt}
format-volume-prefix-background = ${colors.foreground-ena}
format-muted-prefix-foreground = ${colors.foreground-ena-alt}
format-muted-prefix-background = ${colors.foreground-ena}
format-volume = <label-volume>

label-volume = %percentage%%
label-volume-foreground = ${colors.foreground-ena-alt}
label-volume-background = ${colors.foreground-ena}
label-muted = muted
label-muted-background = ${colors.foreground-ena}
label-muted-foreground = ${colors.foreground-ena-alt}

[module/battery3]
type = internal/battery
battery = BAT1
adapter = ADP1
poll-interval = 4
label-charging = %percentage%% 󱐋
label-charging-foreground = ${colors.foreground-ena-alt}
label-charging-background = ${colors.foreground-ena}
label-full-foreground = ${colors.foreground-ena-alt}
label-full-background = ${colors.foreground-ena}
label-discharging-foreground = ${colors.foreground-ena-alt}
label-discharging-background = ${colors.foreground-ena}
format-charging = <label-charging>
format-full-prefix = "   "
format-charging-prefix = "   "
format-discharging-prefix = "   "
;format-full-prefix-margin-right = 2
;format-charging-prefix-margin-right = 2
;format-discharging-prefix-margin-right = 2
format-full-prefix-foreground = ${colors.foreground-ena-alt}
format-charging-prefix-foreground = ${colors.foreground-ena-alt}
format-discharging-prefix-foreground = ${colors.foreground-ena-alt}
format-full-prefix-background = ${colors.foreground-ena}
format-charging-prefix-background = ${colors.foreground-ena}
format-discharging-prefix-background = ${colors.foreground-ena}

[module/brightness3]
type = internal/backlight

card = intel_backlight
format = <label>
format-prefix = " 󰃠 "
format-prefix-background = ${colors.foreground-ena}
format-prefix-foreground = ${colors.foreground-ena-alt}
;format-prefix-margin-right = 1
label = " %percentage%%"
label-foreground = ${colors.foreground-ena-alt}
label-background = ${colors.foreground-ena}

[network-base3]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected =  %{F#707880} disconnected

[module/wlan3]
inherit = network-base3
interface-type = wireless
format-connected-prefix = "   "
format-connected-prefix-foreground = ${colors.foreground-ena-alt}
format-connected-prefix-background = ${colors.foreground-ena}
format-disconnected-prefix = "   "
format-disconnected-prefix-foreground = ${colors.foreground-ena-alt}
format-disconnected-prefix-background = ${colors.foreground-ena}
;format-connected-prefix-margin-right = 2
;format-disconnected-prefix-margin-right = 2
;label-disconnected-foreground = ${colors.disabled}
label-connected =  "%{A1:urxvt -e iwctl &:}%essid%%{A}"
label-disconnected =  "%{A1:urxvt -e iwctl &:}disconnected%{A}"
label-connected-foreground = ${colors.foreground-ena-alt}
label-disconnected-foreground = ${colors.foreground-ena-alt}
label-connected-background = ${colors.foreground-ena}
label-disconnected-background = ${colors.foreground-ena}

[module/round-right]
type = custom/text
content = %{T3}%{T-}
content-foreground = ${colors.foreground-ena}

[module/round-left]
type = custom/text
content = %{T3}%{T-}
content-foreground = ${colors.foreground-ena}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
