[module/date]
type = internal/date
date = %H:%M
date-alt = %d-%m-%Y %H:%M
;format-prefix = ""
format-prefix-margin-right = 2
format-prefix-foreground = ${colors.primary}
label = %date%
label-font = 2
label-foreground = ${colors.primary}

[module/date2]
type = internal/date
interval = 1

time = "%H:%M"
time-alt = "%a, %b %d %H:%M:%S"

format = %{T9}%{T-} <label>
format-background = ${colors.foreground}
format-foreground = ${colors.background}
;format-padding = 1
label = %{T2}%time%%{T-}
