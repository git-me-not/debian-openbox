[module/date]
type = internal/date
date = %H:%M
date-alt = %d-%m-%Y %H:%M
format-prefix-foreground = ${colors.primary}
label = %{T2}%date%%{T-}
label-foreground = ${colors.primary}

[module/time]
type=internal/date
interval = 1
time = "%H:%M"
time-alt = %H:%M:%S
format-prefix = ""
format-prefix-margin-right = 2
;format-background = ${colors.foreground}
format-foreground = ${colors.primary}
;format-padding = 1
label = %{T2}%time%%{T-}
